<!doctype html>
<!-- The agent's own page (GET /brain), in the Rulith Brain app's look and words: whether Brain runs (connected, not
     running, loading the model), the switch "Learn from research", "Remember conversations" (read-only: it is set in
     the Rulith Brain app; the agent never asks the memory to forget), and the documents the last answer drew on. The
     memory's mechanics (mode, KV, windows, the live window, the turn, the session, what joined, lookups, the server's
     error codes) only with ?advanced=1. It reads GET /brain/state every two seconds and, every few seconds, asks the
     forwarder to ask the server again (?refresh=1); the memory server is asked for the sources of an answer only when
     they are opened (POST /brain/windows); the switch is POST /brain/settings. English or Chinese by the browser's
     language. States are words, marks and border styles, never colour alone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rulith Brain Agent</title>
<style>
  /* the app's palette (integrations/brain-ui/css/brain.css): a pale grey page, white cards, slate text, one blue */
  :root {
    --bg: #f5f7fa; --bar: #ffffff; --card: #ffffff; --fg: #0f172a; --dim: #475569; --line: #e2e6ec; --edge: #8b95a7;
    --soft: #eef2f6; --accent: #2563eb; --accent-hover: #1d4ed8; --accent-text: #2563eb; --accent-soft: #e8f0fe;
    --on-accent: #ffffff; --ring: rgba(37, 99, 235, .22); --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --bar: #131c31; --card: #162036; --fg: #f1f5f9; --dim: #cbd5e1; --line: #2a3650; --edge: #64748b; --soft: #1b2740;
      --accent: #2563eb; --accent-hover: #1d4ed8; --accent-text: #60a5fa; --accent-soft: #1e2a44; --on-accent: #ffffff;
      --ring: rgba(96, 165, 250, .28); --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
  .top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 20px;
    background: var(--bar); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
  .brand svg { width: 26px; height: 26px; }
  main { max-width: 820px; margin: 0 auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
  h3 { font-size: 15px; margin: 0 0 4px; font-weight: 650; }
  p { margin: 0 0 6px; }
  .dim { color: var(--dim); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .row > div { min-width: 0; }
  /* a state: a glyph and words, and its border says it too (solid: on / connected, dashed: off / not running,
     dotted: waiting) */
  .mark { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--edge); border-radius: 999px; padding: 1px 10px;
    font-size: 13px; font-weight: 600; white-space: nowrap; }
  .mark.on { border-color: var(--accent-text); color: var(--accent-text); }
  .mark.off { border-style: dashed; font-weight: 500; }
  .mark.wait { border-style: dotted; }
  .mark.bad { border-width: 2px; }
  .notice { border-left: 4px solid var(--edge); }
  .notice.wait { border-left-style: dotted; }
  .notice.off { border-left-style: dashed; }
  button { font: inherit; cursor: pointer; }
  .switch { display: inline-flex; align-items: center; gap: 8px; min-width: 78px; justify-content: center; border-radius: 999px; padding: 4px 14px;
    border: 1.5px solid var(--edge); background: var(--card); color: var(--fg); font-weight: 600; }
  .switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .switch[aria-checked="false"] { border-style: dashed; font-weight: 500; }
  .switch:hover { box-shadow: 0 0 0 3px var(--ring); }
  .switch:disabled { cursor: default; opacity: .7; box-shadow: none; }
  .ro { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--edge); border-radius: 999px; padding: 4px 12px;
    color: var(--dim); font-size: 13px; white-space: nowrap; }
  .link { background: none; border: none; padding: 0; color: var(--accent-text); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .link:hover { text-decoration: underline; }
  .chev { display: inline-block; transition: transform .15s; }
  .link[aria-expanded="true"] .chev { transform: rotate(90deg); }
  ul.list { margin: 6px 0 0; padding: 0 0 0 2px; list-style: none; }
  ul.list li { padding: 3px 0; display: flex; gap: 8px; align-items: baseline; }
  ul.list li::before { content: "▪"; color: var(--dim); }
  .question { margin: 4px 0 8px; padding: 8px 12px; background: var(--accent-soft); border-radius: 10px; overflow-wrap: anywhere; }
  /* advanced */
  .adv-head { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 14px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .k { font-size: 12px; color: var(--dim); }
  .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { font-size: 12px; color: var(--dim); font-weight: 600; }
  td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .small { font-size: 12px; border: 1px solid var(--edge); background: var(--card); color: var(--fg); border-radius: 6px; padding: 0 8px; margin-left: 6px; }
  .mono { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#mk)"/><g transform="translate(3.5 5.4) scale(0.9)"><g fill="#fff"><ellipse cx="32" cy="30" rx="24" ry="15"/><circle cx="13" cy="29" r="9"/><circle cx="19" cy="20" r="9"/><circle cx="30" cy="15.5" r="9"/><circle cx="42" cy="16.5" r="9"/><circle cx="51" cy="23" r="9"/><circle cx="54" cy="32" r="8"/><circle cx="22" cy="38" r="9"/><circle cx="33" cy="40" r="8"/><ellipse cx="48" cy="42.5" rx="9" ry="6.5"/><path d="M35 44H44L45.6 51.2A3.4 3.4 0 0 1 42.3 55.3H39.6A3.4 3.4 0 0 1 36.2 52.3Z"/></g><g fill="none" stroke="#2563EB" stroke-width="1.9" stroke-linecap="round"><path d="M8.5 27.5q4.5 -2.5 8 0.5"/><path d="M21.5 12.5q-1.8 4.8 1.8 8.4"/><path d="M33.5 8.5q-2.6 6 1.4 10q3 3.6 0.4 8"/><path d="M45.5 12.5q-2.5 4.5 1.5 8"/><path d="M49.5 27q4.5 0.5 6 4.5"/><path d="M17 32q6.5 -3.2 13.5 0"/><path d="M39.5 29.5q5 2 4 8"/><path d="M41.8 40.6q5.6 -3.4 12 -0.4"/></g></g></svg><span id="title"></span></div>
  <div id="conn" role="status" aria-live="polite"></div>
</header>
<main>
  <section class="card notice" id="notice" hidden><h2 id="notice-title"></h2><p class="dim" id="notice-help"></p></section>
  <section class="card"><h3 id="about-title"></h3><p class="dim" id="about-text"></p></section>
  <section class="card">
    <div class="row">
      <div><h3 id="learn-name"></h3><p class="dim" id="learn-how"></p></div>
      <button type="button" class="switch" role="switch" id="learn-switch" aria-labelledby="learn-name"></button>
    </div>
    <div id="learn-more"></div>
  </section>
  <section class="card">
    <div class="row">
      <div><h3 id="remember-name"></h3><p class="dim" id="remember-help"></p></div>
      <span class="ro" id="remember-ro"></span>
    </div>
  </section>
  <section class="card">
    <h3 id="last-title"></h3>
    <div id="last"></div>
  </section>
  <section id="advanced" hidden>
    <h2 class="adv-head" id="adv-title"></h2>
    <p class="dim" id="adv-server"></p>
    <div id="adv-error"></div>
    <div class="grid" id="adv-memory"></div>
    <h2 class="adv-head" id="adv-session-title"></h2>
    <div class="card" id="adv-session"></div>
    <h2 class="adv-head" id="adv-turns-title"></h2>
    <div class="card" style="padding: 4px 6px"><table><thead><tr id="adv-turns-head"></tr></thead><tbody id="adv-turns"></tbody></table></div>
  </section>
</main>
<script>
// the browser's language (?lang=en or ?lang=zh for one visit, as the app's page has it)
const askedLang = new URLSearchParams(location.search).get('lang');
const zh = askedLang === 'zh' || askedLang === 'en' ? askedLang === 'zh' : /^zh\b/i.test(navigator.language || (navigator.languages || [])[0] || '');
const T = zh ? {
  lang: 'zh-CN', title: 'Rulith Brain Agent', checking: '正在检查 Rulith Brain…', up: '已连接', upLong: '已连接 Rulith Brain',
  memory: (name) => `记忆：${name}`,
  down: 'Brain 未运行', downHelp: '请打开 Rulith Brain，点击“加载模型并启动”。使用智能体期间请保持应用打开。',
  loading: 'Brain 正在加载模型', loadingHelp: '需要几分钟，准备好后智能体会自动继续。',
  waitBusy: '正在等待 Brain', waitBusyHelp: 'Brain 正在回答另一个对话（比如应用里的提问）。它答完后，智能体会自动继续。',
  noAgent: '智能体没有响应', noAgentHelp: '它的窗口可能已经关闭。重新启动智能体后，请用它启动时显示的地址打开本页。',
  aboutTitle: '和 Rulith Brain 共用一份记忆',
  aboutText: '这个智能体没有自己的模型，也没有自己的记忆：它用的是 Rulith Brain 在这台电脑上运行的模型和记忆。你在这里交代和完成的事会被记住，Rulith Brain 应用里的对话也知道。',
  learnName: '调研时学习', learnHow: '智能体完成任务时阅读的网页会学进记忆。', on: '开', off: '关',
  readOnly: '这个记忆是只读的，不会学习。', cannot: '这个记忆不能学习。', pages: (n) => `已学习 ${n} 个网页，最新的：`,
  rememberName: '记住对话', rememberRo: '在应用中设置', rememberHelp: '在 Rulith Brain 应用的“设置”中设置。智能体自己从不要求记忆忘记对话。',
  rememberCannot: '这个记忆还不能忘记对话：对话总会被记住。', rememberReadOnly: '这个记忆是只读的，不保留对话。',
  lastTitle: '最近一条回答', lastNone: '还没有回答。', lastFailed: '最近一条消息没有得到回答。', lastWriting: '回答还在生成中。',
  asked: '问题：', sources: '来源', sourcesReading: '正在读取出处…', sourcesNone: '这条回答没有用到文档。', sourcesFailed: '无法读取出处。',
  // ?advanced=1
  advTitle: '工作原理（高级）', server: (s) => `记忆服务 ${s}`, readAt: (t) => ` · ${t} 读取`, notRead: ' · 尚未读取（随第一条消息读取）',
  mode: '模式', frozen: '冻结（只读）', growing: '增长（更新）', unknown: '未知', brain: 'Brain 模式', brainOff: '关',
  brainOn: (front, k, every) => `${front === 'kv' ? '原生调出（KV）' : '原文（技能）'}，${k} 个窗口，每 ${every} 步扫描`,
  tokens: '记住的 token', live: '实时窗口', of: (n) => `/ ${n}`, turn: '记忆轮次', sessionTitle: '对话',
  sessionLine: (n, t, resumed) => `自 ${t} 起 ${n} 轮${resumed ? ' · 由此前的对话重新开始' : ''}`, sessionNone: '还没有对话：下一条消息会开始一个。',
  sessionNew: '下一条消息开始新对话', turnsTitle: '最近几轮调出了什么',
  cols: ['时间', '轮次', '对话', '问题', '调出', '查阅'], none: '无', nothing: '还没有。', failed: '✕ 失败', notFinished: '回答未完成',
  windows: (n) => `${n} 个窗口`, joined: (n) => `，回答时加入 ${n} 个`, showSources: '出处', noLabel: '（无标签）',
  session: { new: '新对话', continued: '继续', resumed: '重新开始（重读对话）', retaken: '撤回该轮后重问' },
  lastError: (code, message) => `${code} — ${message}`,
} : {
  lang: 'en', title: 'Rulith Brain Agent', checking: 'Checking Rulith Brain…', up: 'Connected', upLong: 'Connected to Rulith Brain',
  memory: (name) => `Memory: ${name}`,
  down: 'Brain is not running', downHelp: 'Open Rulith Brain and press "Load the model and start". Keep the app open while you use the agent.',
  loading: 'Brain is loading the model', loadingHelp: 'This takes a few minutes; the agent goes on by itself when it is ready.',
  waitBusy: 'Waiting for Brain', waitBusyHelp: 'Brain is answering another conversation (a question in the app, for example). The agent goes on by itself when that answer is done.',
  noAgent: 'The agent does not answer', noAgentHelp: 'Its window may have been closed. Start the agent again and open this page from the address it prints.',
  aboutTitle: 'One memory, shared with Rulith Brain',
  aboutText: 'This agent has no model and no memory of its own: it works with the model and the memory that Rulith Brain runs on this PC. What you ask and do here is remembered, and the chat in the Rulith Brain app knows it too.',
  learnName: 'Learn from research', learnHow: 'Pages the agent reads while working on a task are learned into the memory.', on: 'On', off: 'Off',
  readOnly: 'This memory is read-only: it does not learn.', cannot: 'This memory cannot learn.',
  pages: (n) => `${n} page${n === 1 ? '' : 's'} learned, the newest:`,
  rememberName: 'Remember conversations', rememberRo: 'Set in the app', rememberHelp: 'Set in the Rulith Brain app, under Settings. The agent itself never asks the memory to forget.',
  rememberCannot: 'This memory cannot forget conversations yet: they are always remembered.', rememberReadOnly: 'This memory is read-only: it keeps no conversation.',
  lastTitle: 'The last answer', lastNone: 'No answer yet.', lastFailed: 'The last message was not answered.', lastWriting: 'The answer is still being written.',
  asked: 'Asked: ', sources: 'Sources', sourcesReading: 'Reading the sources…', sourcesNone: 'No document was used for this answer.', sourcesFailed: 'The sources could not be read.',
  advTitle: 'How it works (advanced)', server: (s) => `Memory server ${s}`, readAt: (t) => ` · read ${t}`, notRead: ' · not read yet (it is read with the first message)',
  mode: 'Mode', frozen: 'Frozen (read-only)', growing: 'Growing (update)', unknown: 'unknown', brain: 'Brain mode', brainOff: 'Off',
  brainOn: (front, k, every) => `${front === 'kv' ? 'native recall (KV)' : 'source text (skill)'}, ${k} windows, a scan every ${every === 1 ? 'step' : every + ' steps'}`,
  tokens: 'Remembered tokens', live: 'In the live window', of: (n) => `of ${n}`, turn: 'Memory turn', sessionTitle: 'Conversation',
  sessionLine: (n, t, resumed) => `${n} turn${n === 1 ? '' : 's'} since ${t}${resumed ? ' · started again from the conversation so far' : ''}`,
  sessionNone: 'No conversation yet: the next message starts one.', sessionNew: 'Start a new conversation with the next message',
  turnsTitle: 'What the last turns recalled',
  cols: ['Time', 'Turn', 'Conversation', 'Question', 'Recalled', 'Lookups'], none: 'none', nothing: 'Nothing yet.', failed: '✕ Failed', notFinished: 'answer not finished',
  windows: (n) => `${n} window${n === 1 ? '' : 's'}`, joined: (n) => `, ${n} joined while answering`, showSources: 'Sources', noLabel: '(no label)',
  session: { new: 'New conversation', continued: 'Continued', resumed: 'Started again (conversation re-read)', retaken: 'Turn taken back, asked again' },
  lastError: (code, message) => `${code} — ${message}`,
};
const ADVANCED = new URLSearchParams(location.search).get('advanced') === '1';
const $ = (id) => document.getElementById(id);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(typeof c === 'string' ? document.createTextNode(c) : c);
  return el;
};
const fill = (el, ...kids) => { el.replaceChildren(...kids.flat().filter((c) => c !== null && c !== undefined && c !== false)); return el; };
// a part of the page is drawn again only when what it shows changed (a control keeps the focus between reads)
const drawn = new Map();
let local = 0;   // bumped when something of the page's own changes (a list opened, sources read)
const draw = (el, key, build) => { const k = JSON.stringify(key) + '/' + local; if (drawn.get(el) === k) return; drawn.set(el, k); fill(el, build()); };
// a state as a glyph, words and a border style - never colour alone
const mark = (kind, text) => h('span', { class: `mark ${kind}` }, h('span', { 'aria-hidden': 'true', text: { on: '✓', off: '○', wait: '…', bad: '✕' }[kind] ?? '•' }), text);
const num = (n) => n === null || n === undefined ? T.unknown : Number(n).toLocaleString(zh ? 'zh-CN' : 'en-US');
const time = (iso) => new Date(iso).toLocaleTimeString(zh ? 'zh-CN' : undefined);
// the windows a turn had in front of it: as it ended when the answer said so, else as it began
const recalled = (t) => [...new Set(t.windows ? [...(t.windows.front || []), ...(t.windows.text || []), ...(t.windows.appended || []), ...(t.windows.kv_added || [])] : (t.focus ? t.focus.ids : []))];
// a window's label names its document ("<name> (part 2 of 5)" is one long document); a window without one is conversation
const documentOf = (label) => String(label || '').replace(/ \(part \d+ of \d+\)$/, '').trim();

document.documentElement.lang = T.lang;
$('title').textContent = T.title;
$('about-title').textContent = T.aboutTitle;
$('about-text').textContent = T.aboutText;
$('learn-name').textContent = T.learnName;
$('learn-how').textContent = T.learnHow;
$('remember-name').textContent = T.rememberName;
$('remember-ro').textContent = T.rememberRo;
$('last-title').textContent = T.lastTitle;
$('advanced').hidden = !ADVANCED;

let state = null;          // the last /brain/state
let reachable = true;      // whether the forwarder (this page's own server) answered the last read
const docs = new Map();    // turn id -> { busy, names, failed }: the documents an answer drew on, once opened
let openTurn = null;       // the turn whose sources are open
let advSources = new Map();

async function setLearn(on) {
  $('learn-switch').disabled = true;
  try { await fetch('/brain/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ learn_research: on }) }); } catch { /* the next read says */ }
  $('learn-switch').disabled = false;
  await read();
}
$('learn-switch').addEventListener('click', () => { if (state?.learn) void setLearn(!state.learn.research); });

async function sourcesOf(t) {
  const r = await (await fetch('/brain/windows', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ windows: recalled(t) }) })).json();
  if (!Array.isArray(r.windows)) throw new Error(r.error ? r.error.message : 'no answer');
  return r.windows;
}

async function toggleSources(t) {
  openTurn = openTurn === t.id ? null : t.id;
  if (openTurn !== null && !docs.has(t.id)) {
    docs.set(t.id, { busy: true });
    local++;
    render();
    try {
      const count = new Map();
      for (const w of await sourcesOf(t)) { const n = documentOf(w.label); if (n) count.set(n, (count.get(n) || 0) + 1); }
      docs.set(t.id, { names: [...count].sort((a, b) => b[1] - a[1]).map(([n]) => n) });
    } catch {
      docs.set(t.id, { failed: true });
    }
  }
  local++;
  render();
  $('sources-toggle')?.focus();
}

function renderConn() {
  const s = state, reach = s?.reach?.state ?? (s?.seen_at ? 'up' : null);
  let conn, notice = null;
  if (!reachable) { conn = mark('bad', T.noAgent); notice = ['bad', T.noAgent, T.noAgentHelp]; }
  // (a turn of the agent's that waits for another conversation's answer: said in plain words, it is not a fault)
  else if (reach === 'up' && s.waiting && s.waiting.reason !== 'loading') { conn = mark('wait', T.waitBusy); notice = ['wait', T.waitBusy, T.waitBusyHelp]; }
  else if (reach === 'up') conn = mark('on', s.name ? `${T.up} · ${T.memory(s.name)}` : T.upLong);
  else if (reach === 'loading') { conn = mark('wait', T.loading); notice = ['wait', T.loading, T.loadingHelp]; }
  else if (reach === 'down') { conn = mark('off', T.down); notice = ['off', T.down, T.downHelp]; }
  else conn = mark('wait', T.checking);
  draw($('conn'), [reachable, reach, s?.name ?? null, !!s?.waiting], () => conn);
  $('notice').hidden = !notice;
  if (notice) {
    $('notice').className = `card notice ${notice[0]}`;
    $('notice-title').textContent = notice[1];
    $('notice-help').textContent = notice[2];
  }
}

function renderLearn() {
  const l = state?.learn;
  const sw = $('learn-switch');
  sw.hidden = !l;
  if (!l) return draw($('learn-more'), null, () => []);
  sw.setAttribute('aria-checked', String(!!l.research));
  draw(sw, l.research, () => [h('span', { 'aria-hidden': 'true', text: l.research ? '●' : '○' }), l.research ? T.on : T.off]);
  draw($('learn-more'), [l.research, l.can_learn, l.why, l.pages, l.recent.slice(0, 5).map((p) => p.name)], () =>
    l.research && l.can_learn === false ? h('p', {}, mark('off', l.why === 'read_only' ? T.readOnly : T.cannot))
    : l.research && l.pages ? [h('p', { class: 'dim', text: T.pages(l.pages) }), h('ul', { class: 'list' }, l.recent.slice(0, 5).map((p) => h('li', { text: p.name })))]
    : []);
}

function renderRemember() {
  const s = state;
  $('remember-help').textContent = s?.mode === 'read_only' ? T.rememberReadOnly : s?.seen_at && !s.forgetting?.on ? T.rememberCannot : T.rememberHelp;
}

function renderLast() {
  const turns = state?.turns || [];
  const t = turns[0];
  if (!t) return draw($('last'), null, () => h('p', { class: 'dim', text: T.lastNone }));
  draw($('last'), [t.id, t.ok, t.done, recalled(t).length, openTurn], () => lastOf(t));
}

function lastOf(t) {
  const out = [];
  if (t.question) out.push(h('div', { class: 'question' }, h('span', { class: 'dim', text: T.asked }), t.question));
  if (!t.ok) out.push(h('p', {}, mark('bad', T.lastFailed)));
  else if (!t.done) out.push(h('p', {}, mark('wait', T.lastWriting)));
  else if (recalled(t).length) {
    const open = openTurn === t.id;
    out.push(h('button', { type: 'button', class: 'link', id: 'sources-toggle', 'aria-expanded': String(open), onclick: () => void toggleSources(t) },
      h('span', { class: 'chev', 'aria-hidden': 'true', text: '›' }), T.sources));
    if (open) {
      const d = docs.get(t.id) || { busy: true };
      out.push(d.busy ? h('p', { class: 'dim', text: T.sourcesReading })
        : d.failed ? h('p', {}, mark('bad', T.sourcesFailed))
        : d.names.length ? h('ul', { class: 'list' }, d.names.map((n) => h('li', { text: n })))
        : h('p', { class: 'dim', text: T.sourcesNone }));
    }
  } else out.push(h('p', { class: 'dim', text: T.sourcesNone }));
  return out;
}

// ---- ?advanced=1: the mechanics ----

function cell(k, ...v) { return h('div', { class: 'card' }, h('div', { class: 'k', text: k }), h('div', { class: 'v' }, ...v)); }

async function advSourcesOf(t) {
  advSources.set(t.id, h('div', { class: 'dim', text: T.sourcesReading }));
  local++;
  render();
  try {
    const by = new Map();
    for (const w of await sourcesOf(t)) { const k = w.label || T.noLabel; by.set(k, (by.get(k) || 0) + 1); }
    advSources.set(t.id, h('ul', { class: 'list' }, [...by].sort((a, b) => b[1] - a[1]).map(([label, n]) => h('li', {}, h('b', { text: `${n} ×` }), label))));
  } catch (e) {
    advSources.set(t.id, h('div', {}, mark('bad', T.sourcesFailed), ' ', h('span', { class: 'dim', text: e.message })));
  }
  local++;
  render();
}

function renderAdvanced() {
  const s = state;
  if (!ADVANCED || !s) return;
  $('adv-title').textContent = T.advTitle;
  $('adv-server').textContent = T.server(s.server) + (s.seen_at ? T.readAt(time(s.seen_at)) : T.notRead);
  fill($('adv-error'), s.error ? h('p', { class: 'card' }, mark('bad', T.lastError(s.error.code, s.error.message))) : null);
  const m = s.memory || {};
  fill($('adv-memory'),
    cell(T.mode, s.mode === 'read_only' ? mark('off', T.frozen) : s.mode === 'update' ? mark('on', T.growing) : T.unknown),
    cell(T.brain, s.brain.enabled ? h('span', { class: 'dim', text: T.brainOn(s.brain.front, s.brain.focus_k, s.brain.focus_every) }) : mark('off', T.brainOff)),
    cell(T.tokens, num(m.retained_tokens)), cell(T.live, `${num(m.window_tokens)} `, h('span', { class: 'dim', text: T.of(num(m.window_limit)) })),
    cell(T.turn, num(s.turn)));
  $('adv-session-title').textContent = T.sessionTitle;
  draw($('adv-session'), s.session, () => s.session
    ? [T.sessionLine(s.session.turns, time(s.session.startedAt), s.session.resumed), ' ',
      h('button', { type: 'button', class: 'small', onclick: () => fetch('/brain/session/new', { method: 'POST' }).then(() => read()), text: T.sessionNew })]
    : T.sessionNone);
  $('adv-turns-title').textContent = T.turnsTitle;
  draw($('adv-turns-head'), null, () => T.cols.map((c) => h('th', { text: c })));
  draw($('adv-turns'), s.turns.map((t) => [t.id, t.ok, t.done, t.lookups, t.windows]), () => s.turns.length ? s.turns.map((t) => {
    const ids = recalled(t);
    return h('tr', {},
      h('td', { class: 'n', text: time(t.at) }), h('td', { class: 'n', text: t.turn ?? '' }),
      h('td', {}, t.ok ? (T.session[t.session] || t.session) : [h('b', { text: T.failed }), h('br'), h('span', { class: 'dim mono', text: t.error?.code ?? '' })]),
      h('td', { text: t.question }),
      h('td', {}, ids.length ? [h('b', { text: T.windows(ids.length) }), h('span', { class: 'dim', text: ` (${t.front === 'kv' ? 'KV' : 'text'}${t.windows?.kv_added?.length ? T.joined(t.windows.kv_added.length) : ''})` }),
        h('button', { type: 'button', class: 'small', onclick: () => void advSourcesOf(t), text: T.showSources }), advSources.get(t.id) ?? null] : t.ok ? h('span', { class: 'dim', text: T.none }) : null),
      h('td', { class: 'n' }, t.lookups ? String(t.lookups.lookups) : t.ok && !t.done ? h('span', { class: 'dim', text: T.notFinished }) : ''));
  }) : h('tr', {}, h('td', { colspan: 6, class: 'dim', text: T.nothing })));
}

function render() {
  renderConn();
  renderLearn();
  renderRemember();
  renderLast();
  renderAdvanced();
}

// /brain/state every two seconds; the server itself (?refresh=1) every ten while it answers, every four while it does not
let asking = false, askedAt = 0;
async function read(refresh = false) {
  try {
    state = await (await fetch(`/brain/state${refresh ? '?refresh=1' : ''}`, { cache: 'no-store' })).json();
    reachable = true;
  } catch {
    reachable = false;
  }
  render();
}
async function tick() {
  const up = (state?.reach?.state ?? (state?.seen_at ? 'up' : null)) === 'up';
  if (!asking && Date.now() - askedAt >= (up ? 10000 : 4000)) {
    asking = true;
    askedAt = Date.now();
    // (a turn that runs on the server holds its status back until it ends: meanwhile the page shows the last state)
    read(true).finally(() => { asking = false; });
  } else await read();
}
void tick();
setInterval(() => void tick(), 2000);
</script>
